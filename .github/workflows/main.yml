name: CI

on: [push]

jobs:
  sast_scan: 
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 
      uses: actions/setup-python@v4
      with: 
        python-version: 3.x
        
    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: bandit -r . 

  dast:
      runs-on: ubuntu-latest
  
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
  
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.11
  
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            cd Python && pip install -r requirements.txt
            pip install python-owasp-zap-v2.4 zap-cli
  
        - name: Start Flask app
          run: |
            nohup python app.py &
            sleep 10  # wait for Flask to start

        - name: Run ZAP DAST Scan
          run: |
            docker run -u zap -p 8080:8080 -d owasp/zap2docker-stable zap.sh -daemon -port 8080
            sleep 15
            docker exec $(docker ps -q -f ancestor=owasp/zap2docker-stable) zap-cli open-url http://127.0.0.1:5000
            docker exec $(docker ps -q -f ancestor=owasp/zap2docker-stable) zap-cli active-scan http://127.0.0.1:5000
            docker exec $(docker ps -q -f ancestor=owasp/zap2docker-stable) zap-cli report -o zap_report.html -f html
  
    
        - name: Upload ZAP Report
          uses: actions/upload-artifact@v4
          with:
            name: zap-report
            path: zap_report.html
  
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Beta"
          scan: "."
          format: "HTML"
          out: "reports"
          args: "--enableExperimental"

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html

      
