name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  # Job 1: SAST - Static Application Security Testing
  sast-analysis:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # Bandit für Python Code
      - name: Install Bandit
        run: pip install bandit[toml]
      
      - name: Run Bandit SAST Scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt -o bandit-report.txt || true
      
      # Semgrep für Multi-Language Support
      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
          generateSarif: true
      
      - name: Upload SAST Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.*
            semgrep.sarif

  # Job 2: SCA - Software Composition Analysis
  sca-analysis:
    name: SCA Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # OWASP Dependency Check
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'devsecops-project'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
      
      - name: Upload Dependency-Check Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
      
      # Safety für Python Dependencies
      - name: Install Safety
        run: pip install safety
      
      - name: Run Safety Check
        run: |
          pip freeze > requirements-current.txt
          safety check --json --output safety-report.json || true
          safety check --output safety-report.txt || true
        continue-on-error: true
      
      - name: Upload Safety Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-reports
          path: |
            safety-report.*
            requirements-current.txt

  # Job 3: Secret Scanning
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json --output trufflehog-report.json
        continue-on-error: true
      
      - name: Upload Secret Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-reports
          path: |
            trufflehog-report.json

  # Job 4: Container Security Scan
  container-security:
    name: Container Image Scan
    runs-on: ubuntu-latest
    # needs: [sast-analysis, sca-analysis]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t test-app:${{ github.sha }} .
          else
            echo "FROM python:3.11-slim" > Dockerfile
            echo "WORKDIR /app" >> Dockerfile
            echo "COPY . /app" >> Dockerfile
            docker build -t test-app:${{ github.sha }} .
          fi
      
      # Trivy Container Scan
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Run Trivy JSON Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-app:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
        continue-on-error: true
      
      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-results.*
      
      # Anchore/Grype Container Scan
      - name: Run Grype Scan
        uses: anchore/scan-action@v3
        with:
          image: test-app:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          output-format: json
      
      - name: Upload Grype Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-reports
          path: |
            ${{ steps.scan.outputs.json }}

  # Job 5: DAST - Dynamic Application Security Testing
  dast-scan:
    name: DAST Security Testing
    runs-on: ubuntu-latest
    # needs: [container-security]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Test Application
        run: |
          if [ -f docker-compose.yml ]; then
            docker-compose up -d
            sleep 30
          else
            echo "Skipping DAST - no docker-compose.yml found"
          fi
      
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
        continue-on-error: true
      
      - name: Upload ZAP Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

