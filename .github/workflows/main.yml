name: DevSecOps Security Pipeline

on:
push:
branches: [ main, develop ]
pull_request:
branches: [ main, develop ]
workflow_dispatch:

permissions:
contents: read
security-events: write
issues: write

jobs:
# Job 1: SAST - Static Application Security Testing
sast-analysis:
name: SAST Security Scan
runs-on: ubuntu-latest

steps:
- name: Checkout Code
uses: actions/checkout@v4
with:
fetch-depth: 0

- name: Set up Python
uses: actions/setup-python@v4
with:
python-version: '3.11'

# Bandit für Python Code
- name: Install Bandit
run: pip install bandit[toml]

- name: Run Bandit SAST Scan
run: |
         bandit -r . -f json -o bandit-report.json || true
         bandit -r . -f txt -o bandit-report.txt || true
     
# Semgrep für Multi-Language Support
- name: Run Semgrep SAST Scan
uses: returntocorp/semgrep-action@v1
with:
config: >-
           p/security-audit
           p/owasp-top-ten
           p/cwe-top-25
         generateSarif: true

- name: Upload SAST Results
uses: actions/upload-artifact@v4
if: always()
with:
name: sast-reports
path: |
           bandit-report.*
           semgrep.sarif

 # Job 2: SCA - Software Composition Analysis
sca-analysis:
name: SCA Dependency Check
runs-on: ubuntu-latest

steps:
- name: Checkout Code
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v4
with:
python-version: '3.11'

# OWASP Dependency Check
- name: Run OWASP Dependency-Check
uses: dependency-check/Dependency-Check_Action@main
with:
project: 'devsecops-project'
path: '.'
format: 'ALL'
args: >
           --enableRetired
           --enableExperimental
     
- name: Upload Dependency-Check Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: dependency-check-report
@@ -101,7 +101,7 @@
       continue-on-error: true

- name: Upload Safety Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: safety-reports
@@ -136,7 +136,7 @@
continue-on-error: true

- name: Upload Secret Scan Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: secret-scan-reports
@@ -182,7 +182,7 @@
continue-on-error: true

- name: Upload Trivy Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: trivy-reports
@@ -199,7 +199,7 @@
output-format: json

- name: Upload Grype Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: grype-reports
@@ -236,7 +236,7 @@
continue-on-error: true

- name: Upload ZAP Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: zap-reports
@@ -265,7 +265,7 @@
soft_fail: true

- name: Upload Checkov Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: checkov-reports
@@ -285,7 +285,7 @@
continue-on-error: true

- name: Upload KICS Results
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
if: always()
with:
name: kics-reports
@@ -361,7 +361,7 @@
         cat security-summary.md
     
- name: Upload Security Summary
        uses: actions/upload-artifact@v3
        uses: actions/upload-artifact@v4
with:
name: security-summary
path: |
