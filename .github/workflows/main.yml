name: CI

on: [push]

jobs:
  sast_scan: 
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 
      uses: actions/setup-python@v4
      with: 
        python-version: 3.x
        
    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: bandit -r . 

dast:
    runs-on: ubuntu-latest
    services:
      flask:
        image: python:3.11
        ports:
          - 5000:5000
        options: >-
          --health-cmd="curl --silent --fail http://localhost:5000 || exit 1"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask app
        run: |
          nohup python app.py &
          sleep 10  # wait for Flask to start

      - name: Install OWASP ZAP
        run: |
          sudo snap install zaproxy --classic

      - name: Run ZAP DAST Scan
        run: |
          zaproxy -daemon -port 8080 -host 127.0.0.1
          sleep 15
          zap-cli -p 8080 open-url http://127.0.0.1:5000
          zap-cli -p 8080 active-scan http://127.0.0.1:5000
          zap-cli -p 8080 report -o zap_report.html -f html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap_report.html
  
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Beta"
          scan: "."
          format: "HTML"
          out: "reports"
          args: "--enableExperimental"

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html

      
