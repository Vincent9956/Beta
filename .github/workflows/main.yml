name: Security Scan Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Run every Monday at 2 AM UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write  # For uploading to Security tab
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/javascript
            p/nodejs
            p/owasp-top-ten
            p/secrets
      
      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep.sarif
          retention-days: 30

  secrets-detection:
    name: Secret Scanning with Gitleaks
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
      
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run npm audit
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Run Snyk Security Scan (Alternative)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-results.json
      
      - name: Upload dependency scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: |
            npm-audit.json
            snyk-results.json
          retention-days: 30

  container-security-scan:
    name: Container Security Scan with Trivy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t app-image:${{ github.sha }} .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-image:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Run Trivy vulnerability scanner (Table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-image:${{ github.sha }}'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Display Trivy results
        run: |
          echo "# Container Security Scan Results"
          cat trivy-results.txt || echo "No vulnerabilities found or scan failed"
      
      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: |
            trivy-results.sarif
            trivy-results.txt
          retention-days: 30
      
      - name: Check for critical vulnerabilities
        run: |
          if [ -f trivy-results.sarif ]; then
            CRITICAL_COUNT=$(jq '[.runs[].results[] | select(.level=="error")] | length' trivy-results.sarif || echo "0")
            echo "Critical/High vulnerabilities: $CRITICAL_COUNT"
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::warning::Found $CRITICAL_COUNT critical/high vulnerabilities in container image"
            fi
          fi

  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: [semgrep-sast, secrets-detection]
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Start application
        run: |
          node server.js &
          sleep 5
          curl http://localhost:3000 || exit 1
      
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
        continue-on-error: true
          
      - name: Upload ZAP Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30

  security-summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep-sast, secrets-detection, dependency-scan, container-security-scan, dast-scan]
    if: always()
    
    permissions:
      contents: read
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Generate consolidated report
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "## Scan Results Overview" >> security-summary.md
          echo "" >> security-summary.md
          
          echo "### SAST Scan (Semgrep)" >> security-summary.md
          if [ -f semgrep-results/semgrep.sarif ]; then
            SEMGREP_COUNT=$(jq '[.runs[].results[]] | length' semgrep-results/semgrep.sarif || echo "0")
            echo "- Findings: $SEMGREP_COUNT" >> security-summary.md
          else
            echo "- Status: No results file found" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          echo "### Secret Scanning (Gitleaks)" >> security-summary.md
          if [ -f gitleaks-report/gitleaks-report.json ]; then
            SECRETS_COUNT=$(jq 'length' gitleaks-report/gitleaks-report.json || echo "0")
            echo "- Secrets found: $SECRETS_COUNT" >> security-summary.md
          else
            echo "- Status: No secrets detected" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          echo "### Dependency Scan" >> security-summary.md
          if [ -f dependency-scan-results/npm-audit.json ]; then
            echo "- npm audit completed" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          cat security-summary.md
      
      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 30
