name: Security Scan Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Run every Monday at 2 AM UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  sast-scan:
    name: SAST Scan (JavaScript/Node)
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run ESLint Security Plugin
        run: |
          npm install --save-dev eslint eslint-plugin-security
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-results.json || true
          npx eslint . --ext .js,.jsx,.ts,.tsx || true
        continue-on-error: true
      
      - name: Run npm audit
        run: |
          npm audit --json > npm-audit.json || true
          npm audit || true
        continue-on-error: true
      
      - name: Generate SAST Summary
        run: |
          echo "# SAST Scan Results" > sast-summary.md
          echo "" >> sast-summary.md
          echo "## npm audit findings:" >> sast-summary.md
          npm audit --audit-level=moderate || true
          echo "" >> sast-summary.md
          echo "Detailed results available in artifacts."
      
      - name: Upload SAST artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-scan-results
          path: |
            eslint-results.json
            npm-audit.json
            sast-summary.md
          retention-days: 30

  container-security-scan:
    name: Container Security Scan with Trivy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t app-image:${{ github.sha }} .
      
      - name: Run Trivy vulnerability scanner (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-image:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Run Trivy vulnerability scanner (Table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-image:${{ github.sha }}'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Display Trivy results
        run: |
          echo "# Container Security Scan Results"
          cat trivy-results.txt || echo "No vulnerabilities found or scan failed"
      
      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: |
            trivy-results.json
            trivy-results.txt
          retention-days: 30
      
      - name: Check for critical vulnerabilities
        run: |
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          echo "High vulnerabilities: $HIGH_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::warning::Found $CRITICAL_COUNT critical vulnerabilities in container image"
          fi

  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: [sast-scan, container-security-scan]
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Start application
        run: |
          node server.js &
          sleep 5
          curl http://localhost:3000 || exit 1
      
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
        continue-on-error: true
          
      - name: Upload ZAP Scan Report (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report-html
          path: report_html.html
          retention-days: 30
      
      - name: Upload ZAP Scan Report (JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report-json
          path: report_json.json
          retention-days: 30
      
      - name: Upload ZAP Scan Report (Markdown)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report-markdown
          path: report_md.md
          retention-days: 30
      



